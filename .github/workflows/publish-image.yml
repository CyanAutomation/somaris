name: Publish Docker image

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          files: .github/workflows/*.yml

  test:
    name: Test and lint Rust and UI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
          cache: false
          rustflags: ""

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes pkg-config libdbus-1-dev

      - name: Cache Cargo build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.99.1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.99.1-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install UI tooling
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium for panel layout tests
        run: npx playwright install --with-deps chromium

      - name: Type-check and test UI
        run: npm run check:ui

      - name: Check compiled UI modules are current
        run: git diff --exit-code -- ui/*.mjs

  dependency-audit:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.99.1
          rustflags: ""

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      - name: Audit locked dependencies
        run: cargo audit

  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Review dependency changes in pull request
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  image-changes:
    name: Check for image input changes
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check changed paths
        id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [[ "$base_sha" =~ ^0+$ ]] || ! git fetch --no-tags --depth=1 origin "$base_sha"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed_paths="$(git diff --name-only "$base_sha" HEAD)"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Eq '^(Dockerfile|Cargo\.toml|Cargo\.lock|openapi\.json|\.dockerignore|src/.*|ui/.*|\.github/workflows/publish-image\.yml)$' <<< "$changed_paths"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  image-validation:
    name: Validate Docker image architectures and vulnerabilities
    if: needs.image-changes.outputs.changed == 'true'
    needs: [test, dependency-audit, dependency-review, workflow-lint, image-changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: somaris-scan:amd64
          cache-from: |
            type=gha
            type=gha,scope=somaris-amd64
          cache-to: type=gha,scope=somaris-amd64,mode=max

      - name: Scan linux/amd64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: somaris-scan:amd64
          version: v0.70.0
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Build linux/arm64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: somaris-scan:arm64
          cache-from: |
            type=gha
            type=gha,scope=somaris-amd64
            type=gha,scope=somaris-arm64
          cache-to: type=gha,scope=somaris-arm64,mode=max

      - name: Scan linux/arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: somaris-scan:arm64
          version: v0.70.0
          severity: HIGH,CRITICAL
          exit-code: '1'

  publish:
    name: Build and publish image
    if: github.event_name == 'push' && needs.image-changes.outputs.changed == 'true'
    needs: [test, dependency-audit, dependency-review, workflow-lint, image-changes, image-validation]
    runs-on: ubuntu-latest
    environment: docker

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: cyanautomation/somaris
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=gha,scope=somaris-amd64
            type=gha,scope=somaris-arm64
          cache-to: type=gha,scope=somaris-release,mode=max
          provenance: true
          sbom: true

      - name: Verify published image architectures
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "cyanautomation/somaris@${IMAGE_DIGEST}" |
            jq -e '
              [.manifests[].platform | "\(.os)/\(.architecture)"] as $platforms
              | ($platforms | index("linux/amd64") != null)
                and ($platforms | index("linux/arm64") != null)
            '
