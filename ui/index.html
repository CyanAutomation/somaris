<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11141a"><title>Somaris — your blinds</title>
  <link rel="stylesheet" href="/ui/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Somaris home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>somaris<span class="brand-dot">.</span></span></a>
      <div class="top-actions">
        <span id="service-status" class="service-status"><span class="status-dot"></span> Connecting</span>
        <details class="display-menu">
          <summary class="icon-button" aria-label="Display mode" title="Display mode">▦</summary>
          <div class="display-popover">
            <label for="display-mode">Display mode</label>
            <select id="display-mode">
              <option value="auto">Auto</option>
              <option value="panel">Panel</option>
              <option value="mobile">Mobile</option>
              <option value="desktop">Desktop</option>
            </select>
            <span class="subtle">Auto adapts to this screen.</span>
            <a class="display-link" href="#service">Service status</a>
          </div>
        </details>
        <button class="icon-button" id="refresh" aria-label="Refresh" title="Refresh">↻</button>
      </div>
    </header>
    <main id="app"><div class="loading">Connecting to Somaris…</div></main>
    <footer>Made for a little more light. <span>Somaris</span></footer>
  </div>
  <script type="module" src="/ui/app.mjs"></script>
</body>
</html>
