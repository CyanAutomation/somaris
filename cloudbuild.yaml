# Builds the Somaris image and deploys a simulator-only public demo on Cloud Run.
# SOMARIS_DEMO_MODE disables physical BLE discovery and control, creates four seeded blinds,
# and keeps each visitor's state in a bounded in-memory session. Cloud Run is held to one
# instance because visitor sessions are process-local. Restarts clear those sessions.
# The session cookie isolates demo state; it is not user authentication.


substitutions:
  _GAR_REGION: europe-west1
  _GAR_REPO: somaris
  _IMAGE_NAME: somaris
  _IMAGE_TAG: latest
  _CLOUD_RUN_REGION: europe-west1
  _SERVICE_NAME: somaris-demo

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-and-push
    env:
      - DOCKER_BUILDKIT=1
    entrypoint: bash
    args:
      - -ceu
      - |
        image="${_GAR_REGION}-docker.pkg.dev/$PROJECT_ID/${_GAR_REPO}/${_IMAGE_NAME}"
        docker buildx create --name somaris-cloudbuild --driver docker-container --use
        docker buildx build \
          --file Dockerfile \
          --progress plain \
          --platform linux/amd64 \
          --cache-from "type=registry,ref=${_GAR_REGION}-docker.pkg.dev/$PROJECT_ID/${_GAR_REPO}/${_IMAGE_NAME}:buildcache" \
          --cache-to "type=registry,ref=${_GAR_REGION}-docker.pkg.dev/$PROJECT_ID/${_GAR_REPO}/${_IMAGE_NAME}:buildcache,mode=max" \
          --tag "${image}:${_IMAGE_TAG}" \
          --tag "${image}:$BUILD_ID" \
          --push .

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-cloud-run
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_GAR_REGION}-docker.pkg.dev/$PROJECT_ID/${_GAR_REPO}/${_IMAGE_NAME}:$BUILD_ID
      - --region
      - ${_CLOUD_RUN_REGION}
      - --platform
      - managed
      - --port
      - "8080"
      - --allow-unauthenticated
      - --no-cpu-throttling
      - --min
      - "1"
      - --max
      - "1"
      - --memory
      - 512Mi
      - --set-env-vars
      - SOMARIS_DEMO_MODE=true
    waitFor:
      - build-and-push

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
