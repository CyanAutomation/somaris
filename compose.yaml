services:
  somaris:
    image: cyanautomation/somaris:latest
    restart: unless-stopped
    ports:
      - "${SOMARIS_HOST_IP:-127.0.0.1}:${SOMARIS_HOST_PORT:-8080}:8080"
    environment:
      - SOMARIS_SIMULATOR=${SOMARIS_SIMULATOR:-true}
      - SOMARIS_ALLOWED_ORIGINS=${SOMARIS_ALLOWED_ORIGINS:-}
      - RUST_LOG=${RUST_LOG:-info}
      - SOMARIS_HISTORY_PATH
      - SOMARIS_COMMAND_MAX_OUTSTANDING=${SOMARIS_COMMAND_MAX_OUTSTANDING:-1000}
      - SOMARIS_COMMAND_MAX_QUEUED_PER_DEVICE=${SOMARIS_COMMAND_MAX_QUEUED_PER_DEVICE:-32}
      - SOMARIS_ADAPTER_CONCURRENCY=${SOMARIS_ADAPTER_CONCURRENCY:-1}
      - SOMARIS_ADAPTER_SCAN_WINDOW_MS=${SOMARIS_ADAPTER_SCAN_WINDOW_MS:-5000}
      - SOMARIS_COMMAND_QUEUE_WAIT_TIMEOUT_SECONDS=${SOMARIS_COMMAND_QUEUE_WAIT_TIMEOUT_SECONDS:-120}
    volumes:
      - somaris-data:/data

volumes:
  somaris-data:
